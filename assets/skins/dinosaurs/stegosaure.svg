<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Stégosaure - Dinosaure avec plaques dorsales -->
  <defs>
    <linearGradient id="stegoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps principal -->
  <path d="M40,170 Q60,140 100,120 Q140,140 160,170 L160,190 L60,190 L60,180 Q100,185 140,180 L140,190 L40,190 Z" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Tête -->
  <path d="M160,170 Q180,160 200,170 Q190,150 180,140 Q170,150 160,170 Z" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  <circle cx="185" cy="155" r="2" fill="#FF0000"/>
  
  <!-- Plaques dorsales -->
  <path d="M70,120 Q75,90 80,120 Q85,90 90,120 Z" fill="#8B8000" stroke="#000" stroke-width="1"/>
  <path d="M90,120 Q95,80 100,120 Q105,80 110,120 Z" fill="#8B8000" stroke="#000" stroke-width="1"/>
  <path d="M110,120 Q115,70 120,120 Q125,70 130,120 Z" fill="#8B8000" stroke="#000" stroke-width="1"/>
  <path d="M130,120 Q135,85 140,120 Q145,85 150,120 Z" fill="#8B8000" stroke="#000" stroke-width="1"/>
  
  <!-- Queue avec épines -->
  <path d="M40,170 Q20,160 0,170 Q10,180 40,170 Z" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  <path d="M20,160 L15,140 L25,140 L20,160 Z" fill="#8B8000" stroke="#000" stroke-width="1"/>
  <path d="M10,170 L5,150 L15,150 L10,170 Z" fill="#8B8000" stroke="#000" stroke-width="1"/>
  
  <!-- Pattes -->
  <path d="M70,190 L70,200 L60,200 L60,190" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  <path d="M100,190 L100,200 L110,200 L110,190" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  <path d="M130,190 L130,200 L140,200 L140,190" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  <path d="M150,190 L150,200 L160,200 L160,190" fill="url(#stegoGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Croix rouge dans l'oeil -->
  <g id="crossEye" style="opacity:0">
    <line x1="180" y1="150" x2="190" y2="160" stroke="#FF0000" stroke-width="2"/>
    <line x1="190" y1="150" x2="180" y2="160" stroke="#FF0000" stroke-width="2"/>
  </g>
  
  <!-- Sang -->
  <g id="bloodEffect" style="opacity:0">
    <path d="M100,120 Q130,100 160,120 Q150,130 100,120" fill="#FF0000" opacity="0.5"/>
    <path d="M80,140 Q110,120 140,140 Q130,150 80,140" fill="#FF0000" opacity="0.5"/>
  </g>
</svg>
