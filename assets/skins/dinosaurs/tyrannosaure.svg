<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tyrannosaure - Grand dinosaure avec point d'ancrage au sol -->
  <defs>
    <linearGradient id="trexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps principal (massif) -->
  <path d="M50,170 Q70,120 90,90 Q110,120 130,170 L130,190 L100,190 L100,180 Q90,185 80,180 L80,190 L50,190 Z" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Tête (énorme) -->
  <path d="M130,170 Q160,160 190,170 Q180,140 170,130 Q160,140 130,170 Z" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  <circle cx="175" cy="150" r="4" fill="#FF0000"/>
  
  <!-- Mâchoire -->
  <path d="M130,170 Q150,180 170,175 Q160,190 130,170 Z" fill="#555" stroke="#000" stroke-width="1"/>
  
  <!-- Dents -->
  <rect x="140" y="175" width="2" height="5" fill="#FFF"/>
  <rect x="145" y="173" width="2" height="7" fill="#FFF"/>
  <rect x="150" y="175" width="2" height="5" fill="#FFF"/>
  <rect x="155" y="172" width="2" height="8" fill="#FFF"/>
  <rect x="160" y="174" width="2" height="6" fill="#FFF"/>
  
  <!-- Bras (petits) -->
  <path d="M90,110 Q70,100 50,110 Q60,120 90,110 Z" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  <path d="M90,110 Q110,100 130,110 Q120,120 90,110 Z" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Queue (épaisse) -->
  <path d="M50,170 Q30,160 10,170 Q20,180 50,170 Z" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Pattes (massives) -->
  <path d="M70,190 L70,200 L60,200 L60,190" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  <path d="M100,190 L100,200 L110,200 L110,190" fill="url(#trexGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Croix rouge dans l'oeil -->
  <g id="crossEye" style="opacity:0">
    <line x1="170" y1="145" x2="180" y2="155" stroke="#FF0000" stroke-width="3"/>
    <line x1="180" y1="145" x2="170" y2="155" stroke="#FF0000" stroke-width="3"/>
  </g>
  
  <!-- Sang -->
  <g id="bloodEffect" style="opacity:0">
    <path d="M100,100 Q130,80 160,100 Q150,120 100,100" fill="#FF0000" opacity="0.5"/>
    <path d="M80,130 Q110,110 140,130 Q130,140 80,130" fill="#FF0000" opacity="0.5"/>
  </g>
</svg>
