<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Raptor - Détouré avec point d'ancrage au sol -->
  <defs>
    <linearGradient id="raptorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps principal (plus petit et agile) -->
  <path d="M70,160 Q85,120 100,100 Q115,120 130,160 L130,180 L110,180 L110,170 Q100,175 90,170 L90,180 L70,180 Z" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  
  <!-- Tête (plus pointue) -->
  <path d="M130,160 Q150,150 170,160 Q160,140 150,130 Q140,140 130,160 Z" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  <circle cx="160" cy="150" r="2" fill="#FF0000"/>
  
  <!-- Bras (plus longs) -->
  <path d="M100,100 Q80,80 60,90 Q70,100 100,100 Z" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  <path d="M100,100 Q120,80 140,90 Q130,100 100,100 Z" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  
  <!-- Griffes sur les bras -->
  <path d="M55,95 L50,90 L55,85" fill="#000" stroke="#000" stroke-width="1"/>
  <path d="M145,95 L150,90 L145,85" fill="#000" stroke="#000" stroke-width="1"/>
  
  <!-- Queue (longue et fine) -->
  <path d="M70,160 Q50,150 30,160 Q40,170 70,160 Z" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  
  <!-- Pattes (longues) -->
  <path d="M90,180 L90,190 L85,190 L85,180" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  <path d="M110,180 L110,190 L115,190 L115,180" fill="url(#raptorGradient)" stroke="#000" stroke-width="1.5"/>
  
  <!-- Griffes sur les pattes -->
  <path d="M85,190 L80,195 L85,200" fill="#000" stroke="#000" stroke-width="1"/>
  <path d="M115,190 L120,195 L115,200" fill="#000" stroke="#000" stroke-width="1"/>
  
  <!-- Croix rouge dans l'oeil -->
  <g id="crossEye" style="opacity:0">
    <line x1="155" y1="145" x2="165" y2="155" stroke="#FF0000" stroke-width="2"/>
    <line x1="165" y1="145" x2="155" y2="155" stroke="#FF0000" stroke-width="2"/>
  </g>
  
  <!-- Sang -->
  <g id="bloodEffect" style="opacity:0">
    <path d="M100,100 Q120,80 140,100 Q130,110 100,100" fill="#FF0000" opacity="0.5"/>
    <path d="M80,120 Q100,100 120,120 Q110,130 80,120" fill="#FF0000" opacity="0.5"/>
  </g>
</svg>
