<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Perroquet - Oiseau coloré -->
  <defs>
    <linearGradient id="parrotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0000FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps -->
  <ellipse cx="100" cy="120" rx="35" ry="25" fill="url(#parrotGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Tête -->
  <circle cx="135" cy="100" r="18" fill="#FF0000" stroke="#000" stroke-width="2"/>
  <circle cx="140" cy="95" r="2" fill="#000"/>
  
  <!-- Bec -->
  <path d="M153,100 L165,95 L153,90 Z" fill="#FFD700" stroke="#000" stroke-width="1"/>
  
  <!-- Ailes -->
  <path d="M65,120 Q45,100 25,120 Q35,130 65,120 Z" fill="#00FF00" stroke="#000" stroke-width="2"/>
  <path d="M135,120 Q155,100 175,120 Q165,130 135,120 Z" fill="#0000FF" stroke="#000" stroke-width="2"/>
  
  <!-- Plumes de la queue -->
  <path d="M35,140 L25,150 L35,160 Z" fill="#FF0000" stroke="#000" stroke-width="1"/>
  <path d="M45,145 L35,155 L45,165 Z" fill="#00FF00" stroke="#000" stroke-width="1"/>
  <path d="M55,150 L45,160 L55,170 Z" fill="#0000FF" stroke="#000" stroke-width="1"/>
  
  <!-- Serres -->
  <path d="M85,165 L85,175 L80,175 L80,165" fill="#FFD700" stroke="#000" stroke-width="1"/>
  <path d="M115,165 L115,175 L120,175 L120,165" fill="#FFD700" stroke="#000" stroke-width="1"/>
  
  <!-- Crête sur la tête -->
  <path d="M125,85 L130,75 L135,85 Z" fill="#FFD700" stroke="#000" stroke-width="1"/>
  
  <!-- Croix rouge dans l'oeil -->
  <g id="crossEye" style="opacity:0">
    <line x1="135" y1="95" x2="145" y2="105" stroke="#FF0000" stroke-width="2"/>
    <line x1="145" y1="95" x2="135" y2="105" stroke="#FF0000" stroke-width="2"/>
  </g>
  
  <!-- Sang -->
  <g id="bloodEffect" style="opacity:0">
    <path d="M100,100 Q130,80 160,100 Q150,110 100,100" fill="#FF0000" opacity="0.5"/>
    <path d="M80,120 Q110,100 140,120 Q130,130 80,120" fill="#FF0000" opacity="0.5"/>
  </g>
</svg>
