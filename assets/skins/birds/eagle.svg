<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Aigle - Oiseau de proie -->
  <defs>
    <linearGradient id="eagleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps -->
  <ellipse cx="100" cy="120" rx="40" ry="30" fill="url(#eagleGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Tête -->
  <circle cx="140" cy="100" r="20" fill="url(#eagleGradient)" stroke="#000" stroke-width="2"/>
  <circle cx="145" cy="95" r="3" fill="#FF0000"/>
  
  <!-- Bec -->
  <path d="M160,100 L170,95 L160,90 Z" fill="#FFD700" stroke="#000" stroke-width="1"/>
  
  <!-- Ailes -->
  <path d="M60,120 Q40,100 20,120 Q30,130 60,120 Z" fill="url(#eagleGradient)" stroke="#000" stroke-width="2"/>
  <path d="M140,120 Q160,100 180,120 Q170,130 140,120 Z" fill="url(#eagleGradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Plumes de la queue -->
  <path d="M40,140 L30,150 L40,160 Z" fill="url(#eagleGradient)" stroke="#000" stroke-width="1"/>
  <path d="M50,145 L40,155 L50,165 Z" fill="url(#eagleGradient)" stroke="#000" stroke-width="1"/>
  <path d="M60,150 L50,160 L60,170 Z" fill="url(#eagleGradient)" stroke="#000" stroke-width="1"/>
  
  <!-- Serres -->
  <path d="M80,170 L80,180 L75,180 L75,170" fill="#FFD700" stroke="#000" stroke-width="1"/>
  <path d="M120,170 L120,180 L125,180 L125,170" fill="#FFD700" stroke="#000" stroke-width="1"/>
  
  <!-- Croix rouge dans l'oeil -->
  <g id="crossEye" style="opacity:0">
    <line x1="140" y1="95" x2="150" y2="105" stroke="#FF0000" stroke-width="2"/>
    <line x1="150" y1="95" x2="140" y2="105" stroke="#FF0000" stroke-width="2"/>
  </g>
  
  <!-- Sang -->
  <g id="bloodEffect" style="opacity:0">
    <path d="M100,100 Q130,80 160,100 Q150,110 100,100" fill="#FF0000" opacity="0.5"/>
    <path d="M80,120 Q110,100 140,120 Q130,130 80,120" fill="#FF0000" opacity="0.5"/>
  </g>
</svg>
